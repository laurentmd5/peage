name: CI/CD - Test, Build & Containerized VPS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Étape 1 : Validation continue & Test du Build Docker
  test-and-build:
    name: Run Tests & Verify Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests (97 tests)
        run: npm run test:all

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Build React Client Bundle
        run: npm run build:client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: peage-system:test

  # Étape 2 : Déploiement 100% Conteneurisé sur le VPS
  deploy-docker:
    name: Containerized Deploy to VPS (Docker)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Docker Container to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: TARGET_DIR
          script: |
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/peage' }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "🚀 [CI/CD] Début du déploiement conteneurisé sur le VPS..."
            echo "📁 Dossier cible : $TARGET_DIR"

            # 1. Vérifier l'accès à Docker pour l'utilisateur de déploiement
            if ! command -v docker &> /dev/null; then
              echo "❌ [ERREUR] La commande 'docker' n'est pas trouvée pour l'utilisateur $USER."
              echo "Assurez-vous que Docker est installé et que l'utilisateur est dans le groupe docker (sudo usermod -aG docker $USER)."
              exit 1
            fi

            if ! docker compose version &> /dev/null; then
              echo "❌ [ERREUR] 'docker compose' n'est pas accessible."
              exit 1
            fi

            # 2. Vérifier ou cloner le projet si premier déploiement
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "==> Premier déploiement détecté, clonage du dépôt..."
              mkdir -p "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # 4. Mettre à jour les sources depuis GitHub main
            echo "==> Récupération des dernières sources (main)..."
            git fetch origin main
            git reset --hard origin/main

            # 5. Déploiement Strictement Conteneurisé (Docker Compose)
            echo "🐳 Construction et démarrage du conteneur Docker..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --force-recreate

            # 6. Nettoyage des anciennes images orphelines
            echo "🧹 Nettoyage des images Docker orphelines..."
            docker image prune -f

            # 7. Vérification de santé du conteneur en cours d'exécution
            echo "🩺 Vérification du statut du conteneur..."
            docker compose ps

            echo "⏳ Attente du démarrage complet de l'application..."
            APP_READY=0
            for attempt in $(seq 1 12); do
              if curl -sf http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
                APP_READY=1
                break
              fi
              echo "  ... tentative $attempt/12 (en attente du serveur)..."
              sleep 2
            done

            if [ "$APP_READY" -eq 1 ]; then
              echo "✅ [HEALTH CHECK] Le conteneur Docker répond parfaitement (HTTP 200 OK) !"
            else
              echo "⚠️ Le conteneur n'a pas répondu immédiatement sur 127.0.0.1:3001. Logs récents :"
              docker compose logs --tail=40
            fi

            echo "🎉 [CI/CD] Déploiement conteneurisé Docker terminé avec succès sur le VPS !"
